<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختيار الروتيشن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#14302c;--mut:#5d7570;--line:#d5e3e0;--acc:#0e7c6b;--accbg:#e1f3ef;--full:#b5473a;--fullbg:#f8e6e3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b19;--card:#172826;--ink:#e6f2ef;--mut:#92aaa5;--line:#2a4440;--acc:#4cc3ae;--accbg:#173a35;--full:#ec8a7d;--fullbg:#3a1f1c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 4px}
h2{font-size:1.1rem;margin:22px 0 8px}
h3{font-size:1rem;margin:18px 0 6px;color:var(--accent,#0a7)}
.sub{color:var(--mut);font-size:.92rem;margin:0 0 14px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number]{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.dept{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.dept:has(input:checked){border-color:var(--acc);background:var(--accbg)}
.dept.full{background:var(--fullbg);border-color:transparent;cursor:not-allowed;opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:600}.left{font-size:.82rem;color:var(--mut)}.full .left{color:var(--full);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}.full .bar i{background:var(--full)}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:600;background:var(--acc);color:#fff}
button.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:400}
button.bad{background:var(--full)}
a.wa{display:block;text-align:center;text-decoration:none;margin-top:8px;border-radius:10px;padding:11px 14px;font-weight:600;background:#25D366;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.go{width:100%}
#msg{margin-top:12px;padding:12px;border-radius:10px;display:none}
#msg.ok{display:block;background:var(--accbg)}#msg.err{display:block;background:var(--fullbg);color:var(--full)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 80px;gap:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,runTransaction,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signInAnonymously,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ====== حط إعدادات مشروعك هنا (من Firebase Console) ====== */
const firebaseConfig={
  apiKey:"AIzaSyBo3amr4LYSzlariXDiaVtyxkw-LbdeKeU",
  authDomain:"nbjjjk.firebaseapp.com",
  projectId:"nbjjjk",
  appId:"1:566764108728:web:61dcfa43de15766b59ed4d"
};
/* ========================================================== */

const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const $=s=>document.querySelector(s),root=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
let rots=[],settings={open:true},picks=[],linksMap={},user=null,unsubPicks=null,unsubLinks=null;
let step=1,form={name:'',rank:'',phone:''},me=null,sel=null,editing=false,flash='';

onSnapshot(query(collection(db,'rotations'),orderBy('order')),s=>{rots=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
onSnapshot(doc(db,'settings','main'),s=>{settings=s.exists()?s.data():{open:true,_missing:true};draw()});
onAuthStateChanged(auth,u=>{user=u;
  if(!u&&location.hash!=='#admin')signInAnonymously(auth).catch(()=>{});
  if(unsubPicks){unsubPicks();unsubPicks=null}
  if(unsubLinks){unsubLinks();unsubLinks=null}
  if(u&&u.email){
    unsubPicks=onSnapshot(query(collection(db,'picks'),orderBy('at','desc')),s=>{picks=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{});
    unsubLinks=onSnapshot(collection(db,'links'),s=>{linksMap={};s.docs.forEach(d=>linksMap[d.id]=d.data().wa||'');draw()},()=>{});
  }
  draw()});
window.addEventListener('hashchange',draw);

function draw(){location.hash==='#admin'?drawAdmin():drawStudent()}
function show(v,html){root.dataset.v=v;root.innerHTML=html}
const norm=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function keysOf(f){
  const name=f.name.trim().replace(/\s+/g,' ');
  const nk=norm(name).toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\//g,'').replace(/ /g,'_');
  const rk=norm(f.rank).toUpperCase().replace(/\s+/g,'').replace(/\//g,'');
  return {name,nk,rk,pk:digits(f.phone)};
}
function validate(){
  const k=keysOf(form);
  if(k.name.length<3||k.nk.length>140)return 'اكتب اسمك بالكامل.';
  if(!k.rk||k.rk.length>20||!/^[0-9A-Z\u0621-\u064A\-]+$/.test(k.rk))return 'الترتيب التراكمي: حروف وأرقام فقط، من غير مسافات أو رموز.';
  if(k.pk.length<10||k.pk.length>15)return 'رقم الموبايل غير صحيح.';
  return '';
}
async function dupes(k){
  const c=[['الاسم','n_'+k.nk],['الترتيب التراكمي','r_'+k.rk],['رقم الموبايل','p_'+k.pk]];
  const r=await Promise.all(c.map(async([l,id])=>{
    const s=await getDoc(doc(db,'claims',id));
    if(!s.exists())return null;
    const o=await getDoc(doc(db,'picks',s.data().p));
    return o.exists()?l:null;
  }));
  return r.filter(Boolean);
}
function rotList(open,cur){
  return rots.map(r=>{const isCur=r.id===cur,full=(r.cap-(r.count||0))<=0&&!isCur,dis=full||isCur||!open;
    return `<label class="dept${full?' full':''}"><div class="row"><span class="name"><input type="radio" name="d" value="${r.id}" ${dis?'disabled':''} ${sel===r.id&&!dis?'checked':''}> ${esc(r.name)}</span><span class="left">${isCur?'روتيشنك الحالي':full?'اكتمل العدد':''}</span></div></label>`}).join('');
}
async function loadLink(){
  if(!me||!me.rotation)return;
  const rot=me.rotation;me.wa=null;
  try{
    if(!auth.currentUser)await signInAnonymously(auth);
    await setDoc(doc(db,'members',auth.currentUser.uid),{phone:me.k.pk,nameKey:me.k.nk,rankKey:me.k.rk});
    const l=await getDoc(doc(db,'links',rot));
    if(me.rotation===rot)me.wa=l.exists()?(l.data().wa||''):'';
  }catch(e){if(me.rotation===rot)me.wa=''}
  if(step===3&&!editing)draw();
}
const waOk=u=>/^https:\/\/chat\.whatsapp\.com\/[A-Za-z0-9_\-?=&%.]+$/.test(u);
function waCard(r){
  if(r&&(r.wa===undefined||r.wa===null))return '<div class="card">جاري تحميل لينك جروب الواتساب…</div>';
  const u=r&&r.wa;
  return u&&waOk(u)?`<div class="card">انضم لجروب الواتساب الخاص بروتيشنك:<br><a class="wa" href="${esc(u)}" target="_blank" rel="noopener">فتح جروب الواتساب</a></div>`:'';
}
function go(step_,edit_){step=step_;editing=!!edit_;sel=null;root.dataset.v='';draw()}

function drawStudent(){
  const open=settings.open!==false&&!settings._missing;
  const closed=open?'':'<div class="card">التسجيل مقفول حاليًا.</div>';
  if(step===1){
    if(root.dataset.v==='s1')return;
    show('s1',`<h1>التسجيل</h1><p class="sub">اكتب بياناتك. كل بيان (الاسم والترتيب التراكمي والموبايل) بيتسجل مرة واحدة بس. لو إنت مسجل قبل كده اكتب نفس بياناتك وهتقدر تعدّل الروتيشن.</p>${closed}
    <input type="text" id="who" placeholder="الاسم بالكامل" value="${esc(form.name)}">
    <input type="text" id="rk" placeholder="الترتيب التراكمي (أرقام أو حروف)" value="${esc(form.rank)}" autocomplete="off">
    <input type="tel" id="ph" placeholder="رقم الموبايل" value="${esc(form.phone)}">
    <button class="go" id="next">تأكيد</button><div id="msg"></div>`);
    $('#next').onclick=async()=>{
      form.name=$('#who').value;form.rank=$('#rk').value;form.phone=$('#ph').value;
      const m=$('#msg'),e=validate();
      if(e){m.className='err';m.textContent=e;return}
      $('#next').disabled=true;
      try{
        const k=keysOf(form),ps=await getDoc(doc(db,'picks',k.pk));
        if(ps.exists()){
          const d=ps.data();
          if(d.nameKey===k.nk&&d.rankKey===k.rk){me={k,rotation:d.rotation,rotationName:d.rotationName};flash='';go(3,false);loadLink();return}
        }
        const dp=await dupes(k);
        if(dp.length){m.className='err';m.textContent='تم التسجيل بالفعل: '+dp.join(' و ')+' مسجل قبل كده.';$('#next').disabled=false;return}
        if(settings.open===false||settings._missing){m.className='err';m.textContent='التسجيل مقفول حاليًا.';$('#next').disabled=false;return}
        me={k};go(2,false);
      }catch(x){m.className='err';m.textContent='حصلت مشكلة في الاتصال، جرب تاني.';$('#next').disabled=false}
    };
    return;
  }
  if(step===2){
    show('s2',`<h1>اختيار الروتيشن</h1><p class="sub">أهلاً ${esc(me.k.name)}، اختار روتيشن واحد.</p>${closed}
    <div id="list">${rotList(open,null)}</div>
    <button class="go" id="go" ${sel&&open?'':'disabled'}>تأكيد الاختيار</button>
    <button class="alt go" id="back" style="margin-top:8px">رجوع لتعديل البيانات</button><div id="msg"></div>`);
    $('#list').onchange=()=>{sel=document.querySelector('input[name=d]:checked').value;$('#go').disabled=false};
    $('#back').onclick=()=>go(1,false);
    $('#go').onclick=submit;
    return;
  }
  const cur=rots.find(r=>r.id===me.rotation),cn=cur?cur.name:me.rotationName;
  const head=`<h1>${esc(flash||'أنت مسجل بالفعل')}</h1><div class="card">${esc(me.k.name)}<br>الروتيشن: <b>${esc(cn)}</b></div>`;
  if(!editing){
    show('s3',head+waCard(me)+closed+`<button class="go" id="edit" ${open?'':'disabled'}>تعديل الروتيشن</button>`);
    $('#edit').onclick=()=>{flash='';go(3,true)};
    return;
  }
  show('s4',`<h1>تعديل الروتيشن</h1><p class="sub">روتيشنك الحالي: <b>${esc(cn)}</b>. اختار الروتيشن اللي عايز تتحول له. الروتيشنز المكتملة مش متاحة.</p>${closed}
  <div id="list">${rotList(open,me.rotation)}</div>
  <button class="go" id="go" ${sel&&open?'':'disabled'}>تأكيد التحويل</button>
  <button class="alt go" id="cancel" style="margin-top:8px">إلغاء</button><div id="msg"></div>`);
  $('#list').onchange=()=>{sel=document.querySelector('input[name=d]:checked').value;$('#go').disabled=false};
  $('#cancel').onclick=()=>go(3,false);
  $('#go').onclick=changeRot;
}

async function submit(){
  const k=me.k,m=$('#msg');
  $('#go').disabled=true;
  try{
    let rname='';
    await runTransaction(db,async tx=>{
      const rr=doc(db,'rotations',sel),snap=await tx.get(rr);
      if(!snap.exists())throw {full:1};
      const r=snap.data();rname=r.name;
      if((r.count||0)>=r.cap)throw {full:1};
      tx.set(doc(db,'claims','p_'+k.pk),{p:k.pk});
      tx.set(doc(db,'claims','r_'+k.rk),{p:k.pk});
      tx.set(doc(db,'claims','n_'+k.nk),{p:k.pk});
      tx.set(doc(db,'picks',k.pk),{name:k.name,phone:k.pk,rank:k.rk,rankKey:k.rk,nameKey:k.nk,rotation:sel,rotationName:r.name,at:serverTimestamp()});
      tx.update(rr,{count:(r.count||0)+1});
    });
    me={k,rotation:sel,rotationName:rname};flash='تم التسجيل ✅';go(3,false);loadLink();
  }catch(e){
    m.className='err';
    if(e.full){m.textContent='للأسف الروتيشن ده اكتمل. اختار واحد تاني من المتاح.'}
    else if(e.code==='permission-denied'){
      const d=await dupes(k).catch(()=>[]);
      m.textContent=d.length?'تم التسجيل بالفعل: '+d.join(' و ')+' مسجل قبل كده.':'التسجيل اتقفل أو حصلت مشكلة. حدّث الصفحة وجرب تاني.';
    }else m.textContent='حصلت مشكلة في الاتصال، جرب تاني.';
    $('#go').disabled=false;
  }
}

async function changeRot(){
  const k=me.k,m=$('#msg');
  $('#go').disabled=true;
  try{
    let nname='';
    await runTransaction(db,async tx=>{
      const pr=doc(db,'picks',k.pk),ps=await tx.get(pr);
      if(!ps.exists())throw {gone:1};
      const old=ps.data().rotation;
      if(old===sel)throw {same:1};
      const nr=doc(db,'rotations',sel),orr=doc(db,'rotations',old);
      const ns=await tx.get(nr),os=await tx.get(orr);
      if(!ns.exists()||(ns.data().count||0)>=ns.data().cap)throw {full:1};
      nname=ns.data().name;
      tx.update(pr,{rotation:sel,rotationName:nname});
      tx.update(nr,{count:(ns.data().count||0)+1});
      if(os.exists())tx.update(orr,{count:Math.max(0,(os.data().count||0)-1)});
    });
    me.rotation=sel;me.rotationName=nname;me.wa=null;flash='تم تحويلك ✅';go(3,false);loadLink();
  }catch(e){
    m.className='err';
    m.textContent=e.full?'الروتيشن ده مفيهوش أماكن فاضية. اختار واحد تاني.':e.gone?'تسجيلك مش موجود. ارجع وسجل من الأول.':e.same?'ده روتيشنك الحالي.':e.code==='permission-denied'?'التعديل مش متاح حاليًا. حدّث الصفحة وجرب تاني.':'حصلت مشكلة في الاتصال، جرب تاني.';
    $('#go').disabled=false;
  }
}

function groups(){
  const cmp=(a,b)=>String(b.rank??'').localeCompare(String(a.rank??''),undefined,{numeric:true,sensitivity:'base'});
  const g=rots.map(r=>({id:r.id,name:r.name,cap:r.cap,list:picks.filter(p=>p.rotation===r.id).sort(cmp)}));
  const known=new Set(rots.map(r=>r.id));
  const rest=picks.filter(p=>!known.has(p.rotation)).sort(cmp);
  if(rest.length)g.push({id:'_',name:'روتيشنز محذوفة',cap:'',list:rest});
  return g;
}
function drawAdmin(){
  if(!user||!user.email){
    root.innerHTML=`<h1>لوحة الإدارة</h1><p class="sub">سجّل دخول بحساب الأدمن.</p>
    <input type="email" id="em" placeholder="الإيميل"><input type="password" id="pw" placeholder="الباسورد">
    <button class="go" id="li">دخول</button><div id="msg"></div>`;
    $('#li').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch(e){$('#msg').className='err';$('#msg').textContent='الإيميل أو الباسورد غلط.'}};
    return;
  }
  const total=rots.reduce((a,r)=>a+(r.count||0),0);
  root.innerHTML=`<h1>لوحة الإدارة</h1><p class="sub">إجمالي المسجلين: ${total} · التسجيل: <b>${settings.open===false?'مقفول':'مفتوح'}</b></p>
  <div class="btns"><button id="tg">${settings.open===false?'افتح التسجيل':'اقفل التسجيل'}</button><button class="alt" id="csv">تصدير CSV</button><button class="alt" id="fix">فحص وتنظيف</button><button class="alt" id="lo">خروج</button></div>
  <h2>الروتيشنز</h2>
  ${rots.length?'':'<div class="card">مفيش روتيشنز. اضغط الزرار تحت لإنشاء الستة الافتراضية.</div><button id="seed">إنشاء الروتيشنز الافتراضية</button>'}
  ${rots.map(r=>`<div class="card" data-id="${r.id}"><div class="grid"><input type="text" class="n" value="${esc(r.name)}"><input type="number" class="c" min="0" value="${r.cap}"></div>
   <input type="url" class="w" dir="ltr" placeholder="لينك جروب الواتساب (https://chat.whatsapp.com/...)" value="${esc(linksMap[r.id]||r.wa||'')}">
   <div class="row"><span class="left">مسجل ${r.count||0} من ${r.cap}</span><span class="btns"><button class="sv">حفظ</button><button class="bad dl">حذف</button></span></div></div>`).join('')}
  <h2>إضافة روتيشن</h2><div class="grid"><input type="text" id="nn" placeholder="الاسم"><input type="number" id="nc" placeholder="العدد" min="1"></div><input type="url" id="nw" dir="ltr" placeholder="لينك جروب الواتساب (اختياري)"><button id="add">إضافة</button>
  <h2>المسجلين (${picks.length})</h2>
  ${groups().map(g=>`<h3>${esc(g.name)} (${g.list.length}${g.cap!==''?' من '+g.cap:''})</h3>${g.list.length?`<div class="tw"><table><tr><th>الترتيب</th><th>الاسم</th><th>الموبايل</th><th></th></tr>${g.list.map(p=>`<tr data-p="${esc(p.id)}" data-r="${esc(p.rotation)}" data-rk="${esc(p.rankKey||'')}" data-nk="${esc(p.nameKey||'')}"><td>${esc(p.rank??'')}</td><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td><button class="alt rm">حذف</button></td></tr>`).join('')}</table></div>`:'<p class="sub">لا يوجد مسجلين.</p>'}`).join('')}<div id="msg"></div>`;
  $('#lo').onclick=()=>signOut(auth);
  $('#fix').onclick=async()=>{
    if(!confirm('هيتم حذف أي بيانات منع تكرار قديمة ملهاش تسجيل، وإعادة حساب أعداد المسجلين لكل روتيشن. متابعة؟'))return;
    const valid=new Set();
    picks.forEach(p=>{valid.add('p_'+p.id);if(p.rankKey)valid.add('r_'+p.rankKey);if(p.nameKey)valid.add('n_'+p.nameKey)});
    let del=0,fix=0;
    const cs=await getDocs(collection(db,'claims'));
    for(const d of cs.docs){if(!valid.has(d.id)){await deleteDoc(d.ref);del++}}
    const cnt={};picks.forEach(p=>{cnt[p.rotation]=(cnt[p.rotation]||0)+1});
    for(const r of rots){const c=cnt[r.id]||0;if((r.count||0)!==c){await updateDoc(doc(db,'rotations',r.id),{count:c});fix++}}
    alert('تم. بيانات منع تكرار اتحذفت: '+del+' · روتيشنز اتصلح عددها: '+fix);
  };
  $('#tg').onclick=()=>setDoc(doc(db,'settings','main'),{open:settings.open===false});
  $('#seed')&&($('#seed').onclick=async()=>{
    await setDoc(doc(db,'settings','main'),{open:true});
    const L=['التخدير','الطوارئ','طب الأسرة','الطب النفسي','خات 1','خات 2'];
    for(let i=0;i<L.length;i++)await addDoc(collection(db,'rotations'),{name:L[i],cap:10,count:0,order:i+1});
  });
  root.querySelectorAll('.card[data-id]').forEach(c=>{
    const id=c.dataset.id;
    c.querySelector('.sv').onclick=()=>{
      const wa=c.querySelector('.w').value.trim();
      if(wa&&!waOk(wa)){alert('اللينك لازم يبدأ بـ https://chat.whatsapp.com/');return}
      Promise.all([
        updateDoc(doc(db,'rotations',id),{name:c.querySelector('.n').value.trim(),cap:Math.max(0,+c.querySelector('.c').value||0),wa:''}),
        setDoc(doc(db,'links',id),{wa})
      ]).then(()=>alert('تم الحفظ'),()=>alert('حصلت مشكلة في الحفظ'));
    };
    c.querySelector('.dl').onclick=()=>{if(confirm('حذف الروتيشن ده؟ التسجيلات القديمة هتفضل في الجدول.')){deleteDoc(doc(db,'rotations',id));deleteDoc(doc(db,'links',id))}};
  });
  $('#add').onclick=()=>{const n=$('#nn').value.trim(),c=+$('#nc').value,wa=$('#nw').value.trim();
    if(wa&&!waOk(wa)){alert('اللينك لازم يبدأ بـ https://chat.whatsapp.com/');return}
    if(n&&c>0)addDoc(collection(db,'rotations'),{name:n,cap:c,count:0,order:Date.now()}).then(r=>wa&&setDoc(doc(db,'links',r.id),{wa}))};
  root.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{
    const tr=b.closest('tr');if(!confirm('حذف التسجيل ده وإرجاع المكان؟'))return;
    await runTransaction(db,async tx=>{
      const rr=doc(db,'rotations',tr.dataset.r),s=await tx.get(rr);
      tx.delete(doc(db,'picks',tr.dataset.p));
      tx.delete(doc(db,'claims','p_'+tr.dataset.p));
      if(tr.dataset.rk)tx.delete(doc(db,'claims','r_'+tr.dataset.rk));
      if(tr.dataset.nk)tx.delete(doc(db,'claims','n_'+tr.dataset.nk));
      if(s.exists())tx.update(rr,{count:Math.max(0,(s.data().count||0)-1)});
    });
  });
  $('#csv').onclick=()=>{
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const rows=[];
    groups().forEach(g=>{
      rows.push(q('الروتيشن: '+g.name+' ('+g.list.length+')'));
      rows.push(['الترتيب التراكمي','الاسم','الموبايل','الوقت'].map(q).join(','));
      g.list.forEach(p=>rows.push([p.rank??'',p.name,p.phone,p.at?.toDate?p.at.toDate().toLocaleString('ar-EG'):''].map(q).join(',')));
      rows.push('');
    });
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='rotations.csv';a.click();
  };
}
draw();
</script>
</body>
</html>
